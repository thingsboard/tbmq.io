<rect x="158" y="752" width="38.769999999999996" height="22" rx="3" fill="#ffffff" fill-opacity="0.07" stroke="none"/><text x="177.385" y="763" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#e9e9f2" text-anchor="middle" letter-spacing="0.69" dominant-baseline="middle">OFF</text><text x="208.76999999999998" y="763" font-family="Roboto, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8e8ea3" text-anchor="start" dominant-baseline="middle">not sent, counted as failed</text>
