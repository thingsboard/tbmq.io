<text x="660" y="901.45" font-family="Roboto, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6a6a7d" text-anchor="middle" dominant-baseline="middle">Two independent settings decide what the outgoing body looks like — the content type that encodes the payload, and whether anything is</text>
<text x="660" y="920.45" font-family="Roboto, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6a6a7d" text-anchor="middle" dominant-baseline="middle">wrapped around it.</text></svg>
