<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ah-3a4250" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a4250"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.4" fill="#c3c7cd" opacity="0.55"/></pattern></defs><rect x="0" y="0" width="1180" height="650" fill="#ffffff"/><rect x="0" y="0" width="1180" height="650" fill="url(#dots)"/><rect x="40" y="56" width="1100" height="500" rx="16" fill="none" stroke="#1f8b4d" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.9"/><rect x="58" y="43.5" width="533.2" height="24" rx="12" fill="#e7f7ee" stroke="#1f8b4d" stroke-width="1.3"/><text x="324.6" y="55.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#166c37" text-anchor="middle" opacity="1" dominant-baseline="middle">TBMQ node · custom actor system (single-thread-at-a-time mailboxes)</text>
<rect x="120" y="130" width="300" height="120" rx="12" fill="#e7f7ee" stroke="#1f8b4d" stroke-width="1.6"/><g transform="translate(134 178) scale(1)" fill="none" stroke="#166c37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.6"/></g><text x="289" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#166c37" text-anchor="middle" opacity="1" dominant-baseline="middle">Client actor</text><text x="289" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#585b62" text-anchor="middle" opacity="1" dominant-baseline="middle">one per connected client</text>
<rect x="130" y="264" width="22" height="22" rx="4" fill="#e7f7ee" stroke="#1f8b4d" stroke-width="1.2"/><rect x="156" y="264" width="22" height="22" rx="4" fill="#e7f7ee" stroke="#1f8b4d" stroke-width="1.2"/><rect x="182" y="264" width="22" height="22" rx="4" fill="#ffffff" stroke="#1f8b4d" stroke-width="1.2"/><rect x="208" y="264" width="22" height="22" rx="4" fill="#ffffff" stroke="#1f8b4d" stroke-width="1.2"/><rect x="234" y="264" width="22" height="22" rx="4" fill="#ffffff" stroke="#1f8b4d" stroke-width="1.2"/><rect x="260" y="264" width="22" height="22" rx="4" fill="#ffffff" stroke="#1f8b4d" stroke-width="1.2"/><text x="130" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#797c82" text-anchor="start" opacity="1" dominant-baseline="middle">mailbox — one thread at a time (CAS)</text>
<rect x="120" y="350" width="300" height="120" rx="12" fill="#fbf0d4" stroke="#d29a1f" stroke-width="1.6"/><g transform="translate(134 398) scale(1)" fill="none" stroke="#8a6410" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 6V3.5M15 6V3.5M9 20.5V18M15 20.5V18M6 9H3.5M6 15H3.5M20.5 9H18M20.5 15H18"/></g><text x="289" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#8a6410" text-anchor="middle" opacity="1" dominant-baseline="middle">Persisted DEVICE actor</text><text x="289" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#585b62" text-anchor="middle" opacity="1" dominant-baseline="middle">one per persistent DEVICE client</text>
<rect x="130" y="484" width="22" height="22" rx="4" fill="#fbf0d4" stroke="#d29a1f" stroke-width="1.2"/><rect x="156" y="484" width="22" height="22" rx="4" fill="#fbf0d4" stroke="#d29a1f" stroke-width="1.2"/><rect x="182" y="484" width="22" height="22" rx="4" fill="#ffffff" stroke="#d29a1f" stroke-width="1.2"/><rect x="208" y="484" width="22" height="22" rx="4" fill="#ffffff" stroke="#d29a1f" stroke-width="1.2"/><rect x="234" y="484" width="22" height="22" rx="4" fill="#ffffff" stroke="#d29a1f" stroke-width="1.2"/><rect x="260" y="484" width="22" height="22" rx="4" fill="#ffffff" stroke="#d29a1f" stroke-width="1.2"/><text x="130" y="522" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#797c82" text-anchor="start" opacity="1" dominant-baseline="middle">mailbox — one thread at a time (CAS)</text>
<rect x="560" y="125" width="540" height="130" rx="12" fill="#f3f5f8" stroke="#1f8b4d" stroke-width="1.4"/>
<text x="576" y="147" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#166c37" text-anchor="start" opacity="1" dominant-baseline="middle">Handles</text>
<text x="580" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17181c" text-anchor="start" opacity="1" dominant-baseline="middle">• CONNECT / DISCONNECT · keep-alive</text>
<text x="580" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17181c" text-anchor="start" opacity="1" dominant-baseline="middle">• SUBSCRIBE / UNSUBSCRIBE</text>
<text x="580" y="219" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17181c" text-anchor="start" opacity="1" dominant-baseline="middle">• PUBLISH · PUBACK / PUBREC / PUBREL / PUBCOMP</text>
<text x="580" y="243" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17181c" text-anchor="start" opacity="1" dominant-baseline="middle">• channel writability (backpressure)</text>
<rect x="560" y="345" width="540" height="130" rx="12" fill="#f3f5f8" stroke="#d29a1f" stroke-width="1.4"/>
<text x="576" y="367" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8a6410" text-anchor="start" opacity="1" dominant-baseline="middle">Handles</text>
<text x="580" y="391" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17181c" text-anchor="start" opacity="1" dominant-baseline="middle">• retrieve &amp; deliver offline-persisted messages</text>
<text x="580" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17181c" text-anchor="start" opacity="1" dominant-baseline="middle">• track in-flight packet ids</text>
<text x="580" y="439" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17181c" text-anchor="start" opacity="1" dominant-baseline="middle">• update / remove messages in Redis on ack</text>
<text x="580" y="463" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17181c" text-anchor="start" opacity="1" dominant-baseline="middle">• shared-subscription retrieval</text>
<path d="M 420 190 L 560 190" fill="none" stroke="#3a4250" stroke-width="1.9" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-3a4250)"/>
<path d="M 420 410 L 560 410" fill="none" stroke="#3a4250" stroke-width="1.9" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-3a4250)"/>
<text x="590" y="594" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#797c82" text-anchor="middle" opacity="1" dominant-baseline="middle">Two actor types, created as sibling root actors on the client-dispatcher and persisted-device-dispatcher pools.</text>
<text x="590" y="622" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#797c82" text-anchor="middle" opacity="1" dominant-baseline="middle">A CAS-guarded mailbox lets at most one thread process an actor at a time — per-client isolation and ordering with no locks on the hot path.</text></svg>
