<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 706" width="1240" height="706" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ah-c3c7cd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3c7cd"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.4" fill="#33363d" opacity="0.7"/></pattern></defs><rect x="0" y="0" width="1240" height="706" fill="#16171a"/><rect x="0" y="0" width="1240" height="706" fill="url(#dots)"/><rect x="40" y="56" width="560" height="548" rx="16" fill="none" stroke="#e6b23f" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.9"/><rect x="58" y="43.5" width="153.2" height="24" rx="12" fill="#3a2f14" stroke="#e6b23f" stroke-width="1.3"/><text x="134.6" y="55.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f2d488" text-anchor="middle" opacity="1" dominant-baseline="middle">Persistent DEVICE</text>
<rect x="640" y="56" width="560" height="548" rx="16" fill="none" stroke="#6b8cff" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.9"/><rect x="658" y="43.5" width="191.2" height="24" rx="12" fill="#182148" stroke="#6b8cff" stroke-width="1.3"/><text x="753.6" y="55.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#aebfff" text-anchor="middle" opacity="1" dominant-baseline="middle">Persistent APPLICATION</text>
<rect x="120" y="110" width="400" height="58" rx="12" fill="#182148" stroke="#6b8cff" stroke-width="1.6"/><g transform="translate(133 128) scale(0.9166666666666666)" fill="none" stroke="#aebfff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.3"/><circle cx="17.5" cy="6" r="2.3"/><circle cx="17.5" cy="18" r="2.3"/><path d="M8 10.9 15.6 6.9M8 13.1l7.6 4"/></g><text x="340" y="131.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="650" fill="#aebfff" text-anchor="middle" opacity="1" dominant-baseline="middle">tbmq.msg.persisted</text><text x="340" y="146.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#a6a8ae" text-anchor="middle" opacity="1" dominant-baseline="middle">ingest buffer · 12 partitions</text>
<rect x="90" y="250" width="460" height="186" rx="12" fill="#25272c" stroke="#e6b23f" stroke-width="1.4"/>
<text x="106" y="271" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f2d488" text-anchor="start" opacity="1" dominant-baseline="middle">Redis / Valkey — sorted set per client</text>
<text x="108" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#f2d488" text-anchor="start" opacity="1" dominant-baseline="middle">{clientId}_messages</text>
<text x="108" y="321" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#a6a8ae" text-anchor="start" opacity="1" dominant-baseline="middle">score = packet id  →  message key</text>
<text x="108" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#f2d488" text-anchor="start" opacity="1" dominant-baseline="middle">packet 7 → msg:2f9c    ·    packet 8 → msg:6b1a</text>
<text x="108" y="367" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#a6a8ae" text-anchor="start" opacity="1" dominant-baseline="middle">each value: SET msgKey … EX = TTL</text>
<text x="108" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#f2d488" text-anchor="start" opacity="1" dominant-baseline="middle">{clientId}_last_packet_id</text>
<text x="108" y="413" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#a6a8ae" text-anchor="start" opacity="1" dominant-baseline="middle">counter · list trimmed to messages-limit</text>
<path d="M 320 168 L 320 250" fill="none" stroke="#c3c7cd" stroke-width="1.9" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-c3c7cd)"/><rect x="260.75" y="198" width="118.5" height="22" rx="7" fill="#1e1f23" stroke="#3b3e45" stroke-width="1.2"/><text x="320" y="209" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a6a8ae" text-anchor="middle" opacity="1" dominant-baseline="middle">consume → store</text>
<rect x="90" y="470" width="460" height="94" rx="12" fill="#25272c" stroke="#e6b23f" stroke-width="1.4"/>
<text x="106" y="491" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f2d488" text-anchor="start" opacity="1" dominant-baseline="middle">On reconnect</text>
<text x="108" y="518" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#a6a8ae" text-anchor="start" opacity="1" dominant-baseline="middle">ZRANGE (REV) → redeliver unacked messages</text>
<text x="108" y="541" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#a6a8ae" text-anchor="start" opacity="1" dominant-baseline="middle">each message removed from the set on ack</text>
<rect x="700" y="110" width="440" height="58" rx="12" fill="#182148" stroke="#6b8cff" stroke-width="1.6"/><g transform="translate(713 128) scale(0.9166666666666666)" fill="none" stroke="#aebfff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.3"/><circle cx="17.5" cy="6" r="2.3"/><circle cx="17.5" cy="18" r="2.3"/><path d="M8 10.9 15.6 6.9M8 13.1l7.6 4"/></g><text x="940" y="131.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="650" fill="#aebfff" text-anchor="middle" opacity="1" dominant-baseline="middle">tbmq.msg.app.$CLIENT_ID</text><text x="940" y="146.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#a6a8ae" text-anchor="middle" opacity="1" dominant-baseline="middle">dedicated · durable, replayable log</text>
<rect x="718.5" y="214" width="46" height="30" rx="5" fill="#182148" stroke="#6b8cff" stroke-width="1.3" opacity="1"/>
<rect x="769.5" y="214" width="46" height="30" rx="5" fill="#182148" stroke="#6b8cff" stroke-width="1.3" opacity="1"/>
<rect x="820.5" y="214" width="46" height="30" rx="5" fill="#182148" stroke="#6b8cff" stroke-width="1.3" opacity="1"/>
<rect x="871.5" y="214" width="46" height="30" rx="5" fill="#182148" stroke="#6b8cff" stroke-width="1.3" opacity="1"/>
<rect x="922.5" y="214" width="46" height="30" rx="5" fill="#182148" stroke="#6b8cff" stroke-width="1.3" opacity="1"/>
<rect x="973.5" y="214" width="46" height="30" rx="5" fill="#16171a" stroke="#6b8cff" stroke-width="1.3" opacity="0.6"/>
<rect x="1024.5" y="214" width="46" height="30" rx="5" fill="#16171a" stroke="#6b8cff" stroke-width="1.3" opacity="0.6"/>
<rect x="1075.5" y="214" width="46" height="30" rx="5" fill="#16171a" stroke="#6b8cff" stroke-width="1.3" opacity="0.6"/>
<text x="718.5" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#83868c" text-anchor="start" opacity="1" dominant-baseline="middle">partition (offset →)</text>
<path d="M 971 278 L 971 248" fill="none" stroke="#c3c7cd" stroke-width="1.9" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-c3c7cd)"/>
<text x="971" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#a6a8ae" text-anchor="middle" opacity="1" dominant-baseline="middle">committed offset</text>
<path d="M 920 168 L 920 214" fill="none" stroke="#c3c7cd" stroke-width="1.9" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-c3c7cd)"/>
<rect x="690" y="322" width="460" height="140" rx="12" fill="#25272c" stroke="#6b8cff" stroke-width="1.4"/>
<text x="706" y="343" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#aebfff" text-anchor="start" opacity="1" dominant-baseline="middle">Per-app consumer group</text>
<text x="708" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#aebfff" text-anchor="start" opacity="1" dominant-baseline="middle">application-persisted-msg-</text>
<text x="708" y="393" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#aebfff" text-anchor="start" opacity="1" dominant-baseline="middle">consumer-group-$CLIENT_ID</text>
<text x="708" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#a6a8ae" text-anchor="start" opacity="1" dominant-baseline="middle">one consumer per APPLICATION client</text>
<text x="708" y="439" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#a6a8ae" text-anchor="start" opacity="1" dominant-baseline="middle">ack = commit offset (no per-message delete)</text>
<rect x="690" y="470" width="460" height="94" rx="12" fill="#25272c" stroke="#6b8cff" stroke-width="1.4"/>
<text x="706" y="491" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#aebfff" text-anchor="start" opacity="1" dominant-baseline="middle">Shared subscriptions</text>
<text x="708" y="518" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#aebfff" text-anchor="start" opacity="1" dominant-baseline="middle">tbmq.msg.app.shared.$TOPIC_FILTER</text>
<text x="708" y="541" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#a6a8ae" text-anchor="start" opacity="1" dominant-baseline="middle">one group shared across APPLICATION clients</text>
<text x="620" y="628" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#83868c" text-anchor="middle" opacity="1" dominant-baseline="middle">Both types survive restarts but store differently: DEVICE messages in a per-client Redis/Valkey sorted set; APPLICATION messages in a dedicated per-client Kafka topic that acts as a replayable log.</text>
<text x="620" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#83868c" text-anchor="middle" opacity="1" dominant-baseline="middle">DEVICE delivery removes messages on acknowledgement; APPLICATION delivery advances a committed offset.</text>
<text x="620" y="678" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#83868c" text-anchor="middle" opacity="1" dominant-baseline="middle">$CLIENT_ID / $TOPIC_FILTER are documentation placeholders — the real suffix is the sanitised or SHA-256-hashed id.</text></svg>
