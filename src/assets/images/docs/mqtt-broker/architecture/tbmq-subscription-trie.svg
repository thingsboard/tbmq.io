<text x="530" y="590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#797c82" text-anchor="middle" opacity="1" dominant-baseline="middle">One PUBLISH matches three subscriptions: exact (sub C), single-level "+" (sub A), multi-level "#" (sub B). The room2 branch is pruned — never visited.</text>
<text x="530" y="616" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#797c82" text-anchor="middle" opacity="1" dominant-baseline="middle">Lookup cost scales with the topic depth (levels traversed), not with the total number of subscriptions.</text></svg>
